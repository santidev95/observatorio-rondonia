services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${LOCAL_PORT:-3000}:3000"
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:-observatorio-local-dev}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      - sh
      - -c
      - exec redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${LOCAL_REDIS_PASSWORD:-observatorio-local-dev}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
