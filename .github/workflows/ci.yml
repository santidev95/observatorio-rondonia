name: Validar projeto

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_REDIS_PASSWORD: fixture-ci-redis
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Preparar Redis local isolado para testes
        run: |
          docker run -d --name redis-test -p 127.0.0.1:6379:6379 --env REDIS_PASSWORD=fixture-ci-redis redis:8-alpine sh -c 'exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"'
          for attempt in $(seq 1 30); do
            if docker exec redis-test sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping' | grep -q PONG; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:worker
      - name: Validar limites do deploy
        run: |
          bash -n deploy/*.sh
          bash tests/deploy-validation.sh
      - name: Validar imagem e worker sem acesso à prefeitura
        run: |
          image="ghcr.io/santidev95/observatorio-rondonia:sha-$GITHUB_SHA"
          docker build --build-arg "APP_REVISION=$GITHUB_SHA" --tag "$image" .
          bash scripts/smoke-worker.sh "$image"
