name: Validar projeto

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validar contribuição
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    uses: ./.github/workflows/validate-build.yml
    permissions:
      contents: read
    with:
      publish: false

  candidate:
    name: Preparar imagem da master
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/validate-build.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  gate:
    name: CI aprovado
    if: always()
    needs: [verify, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir conclusão da validação
        env:
          VERIFY: ${{ needs.verify.result }}
          CANDIDATE: ${{ needs.candidate.result }}
        run: |
          if [[ "$VERIFY" == success && "$CANDIDATE" == skipped ]] ||
             [[ "$VERIFY" == skipped && "$CANDIDATE" == success ]]; then
            exit 0
          fi
          echo 'A validação não terminou com sucesso.' >&2
          exit 1
