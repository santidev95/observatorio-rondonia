name: Publicar produção

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag ou commit já validado pelo CI da master
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  image:
    name: Selecionar imagem validada
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      # O resolvedor é da master protegida; o ref solicitado é apenas um dado.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Resolver revisão e encontrar CI confiável
        id: source
        env:
          SOURCE_REF: ${{ inputs.ref || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/image-manifest.mjs resolve
      - name: Baixar somente o manifesto selecionado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact-id }}
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
          path: verified-image
          merge-multiple: true
          digest-mismatch: error
      - name: Conferir identidade e digest do manifesto
        id: manifest
        env:
          EXPECTED_REVISION: ${{ steps.source.outputs.revision }}
          EXPECTED_RUN_ID: ${{ steps.source.outputs.run-id }}
          EXPECTED_RUN_ATTEMPT: ${{ steps.source.outputs.run-attempt }}
        run: node scripts/ci/image-manifest.mjs verify verified-image/deployment-image.json

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://rondonia.dadosabertos.org
    permissions:
      contents: read
      packages: read
    steps:
      - name: Atualizar aplicação pelo acesso restrito
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          REVISION: ${{ needs.image.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$DEPLOY_SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          [[ $IMAGE_DIGEST =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ $REVISION =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy"' EXIT
          printf '%s' "$GH_TOKEN" | ssh -T -i "$HOME/.ssh/deploy" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -p "${VPS_PORT:-22}" \
            "$VPS_USER@$VPS_HOST" "deploy $IMAGE_DIGEST $REVISION"
      - name: Registrar publicação verificada
        env:
          REVISION: ${{ needs.image.outputs.revision }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          printf 'Produção verificada pela VPS via HTTPS público: https://rondonia.dadosabertos.org — %s\nDigest reutilizado: %s\n' "$REVISION" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
