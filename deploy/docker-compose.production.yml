name: observatorio-rondonia

services:
  app:
    image: ${APP_IMAGE:?Informe a imagem pelo digest}
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure a senha privada na VPS}
    networks: [web, cache]
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    user: redis
    command:
      - sh
      - -c
      - exec redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure a senha privada na VPS}
    networks: [cache]
    volumes:
      - redis_data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    restart: unless-stopped

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?Informe a imagem versionada do cloudflared}
    profiles: [public]
    command:
      [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    networks: [web]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

networks:
  web:
  cache:
    internal: true

volumes:
  redis_data:

secrets:
  tunnel_token:
    file: ./secrets/tunnel-token
